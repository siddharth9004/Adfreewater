<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AdFreeWater | Advertising That Gives Back</title>

<meta name="description" content="AdFreeWater turns free drinking water into a powerful advertising platform.">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #0d1b2e;
    background: #ffffff;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

.container {
    width: min(1160px, 90%);
    margin: auto;
}

/* =========================
   NAVIGATION
========================= */

nav {
    height: 78px;
    border-bottom: 1px solid #e6edf5;
    background: white;
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav-inner {
    width: min(1160px, 90%);
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: #0b75df;
}

.logo span {
    color: #0d1b2e;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
}

.nav-links a {
    font-size: 14px;
    font-weight: 700;
    color: #17324d;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #0673df;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary {
    background: #0875df;
    color: white;
    box-shadow: 0 12px 25px rgba(8,117,223,0.20);
}

.btn-primary:hover {
    transform: translateY(-3px);
    background: #0567c7;
}

.btn-outline {
    background: white;
    border: 1px solid #9ec8ef;
    color: #0d3154;
}

.btn-outline:hover {
    border-color: #0875df;
    color: #0875df;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 610px;
    background:
        radial-gradient(circle at 85% 25%, rgba(135,190,245,0.25), transparent 30%),
        linear-gradient(120deg, #ffffff 40%, #f2f8ff 100%);
    display: flex;
    align-items: center;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 50px;
    align-items: center;
}

.label {
    display: inline-block;
    background: #e5f3ff;
    color: #006edc;
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(54px, 6vw, 76px);
    line-height: 0.98;
    letter-spacing: -3px;
    font-weight: 800;
    margin-bottom: 22px;
}

.hero h1 span {
    color: #0673df;
}

.hero p {
    max-width: 610px;
    font-size: 18px;
    color: #54708f;
    margin-bottom: 28px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.hero-checks {
    display: flex;
    gap: 25px;
    margin-top: 23px;
    color: #3e5973;
    font-size: 13px;
    font-weight: 600;
}

.hero-checks span::before {
    content: "✓";
    color: #0673df;
    margin-right: 7px;
}

/* FINAL HERO LOGO FIX */

.hero-visual {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 25px !important;
    min-height: 500px !important;
    transform: translateY(50px) !important;
}

.hero-logo {
    width: 340px !important;
    max-width: 80% !important;
    height: auto !important;
    display: block !important;
    object-fit: contain !important;
}

.hero-card {
    width: auto !important;
    max-width: 420px !important;
    padding: 16px 28px !important;
    background: white !important;
    border-radius: 16px !important;
    text-align: center !important;
    font-size: 16px !important;
    line-height: 1.5 !important;
    font-weight: 700 !important;
    white-space: nowrap !important;
    box-shadow: 0 15px 40px rgba(30,90,140,0.12) !important;
}

/* =========================
   GENERAL SECTIONS
========================= */

section {
    padding: 100px 0;
}

.section-heading {
    text-align: center;
    max-width: 850px;
    margin: auto;
}

.section-label {
    color: #0071df;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}

.section-heading h2 {
    font-size: clamp(42px, 5vw, 54px);
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 18px;
}

.section-heading p {
    color: #587391;
    font-size: 17px;
}

/* =========================
   HOW IT WORKS
========================= */

.how {
    background: white;
}

.steps {
    margin-top: 70px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 45px;
}

.step-number {
    color: #53aef4;
    font-weight: 800;
    margin-bottom: 48px;
}

.step h3 {
    font-size: 18px;
    margin-bottom: 12px;
}

.step p {
    color: #4f7fa8;
    font-size: 14px;
}

/* =========================
   BRAND SECTION
========================= */

.brand-section {
    background: white;
}

.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 500px;
    align-items: center;
    gap: 80px;
}

.split-image {
    min-height: 450px;
    border-radius: 25px;
    background:
        linear-gradient(135deg, #f7fbff, #eef7ff);
}

.split-content .section-label {
    margin-bottom: 12px;
}

.split-content h2 {
    font-size: clamp(42px, 5vw, 55px);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 22px;
}

.split-content p {
    color: #0d3154;
    margin-bottom: 22px;
}

.bullet-list {
    list-style: none;
    margin: 25px 0;
}

.bullet-list li {
    margin: 15px 0;
    padding-left: 23px;
    position: relative;
    color: #17324d;
}

.bullet-list li::before {
    content: "•";
    color: #0875df;
    font-size: 25px;
    position: absolute;
    left: 0;
    top: -3px;
}

/* =========================
   EVENT SECTION
========================= */

.event-section {
    background: #f3f8fe;
}

.event-section .split-image {
    background: transparent;
    order: 2;
}

.event-section .split-content {
    order: 1;
}

.check-list {
    list-style: none;
    margin: 25px 0;
}

.check-list li {
    margin: 15px 0;
}

.check-list li::before {
    content: "✓";
    color: #0875df;
    font-weight: 800;
    margin-right: 12px;
}

/* =========================
   IMPACT
========================= */

.impact {
    background: white;
}

.cards {
    margin-top: 50px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    border: 1px solid #d8e7f5;
    border-radius: 25px;
    padding: 28px;
    min-height: 215px;
    transition: 0.3s;
    box-shadow: 0 10px 35px rgba(20,80,130,0.04);
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(20,80,130,0.10);
}

.icon {
    width: 50px;
    height: 50px;
    background: #e5f3ff;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    margin-bottom: 22px;
}

.card h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.card p {
    color: #587391;
}

/* =========================
   CAMPAIGN
========================= */

.campaign {
    background: white;
}

.campaign-boxes {
    margin-top: 45px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.campaign-box {
    height: 460px;
    border: 1px solid #d8e1ea;
    border-radius: 22px;
    background: linear-gradient(135deg, #ffffff, #f8fbfe);
}

.campaign-box img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 22px;
}

/* =========================
   BLUE CTA
========================= */

.cta {
    background: linear-gradient(110deg, #0875df, #07529c);
    color: white;
    padding: 70px 0;
}

.cta-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
}

.cta .section-label {
    color: #b7e0ff;
}

.cta h2 {
    font-size: clamp(40px, 5vw, 54px);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 15px;
}

.cta p {
    max-width: 650px;
    color: #dceeff;
}

.btn-white {
    background: white;
    color: #0b3e72;
    white-space: nowrap;
}

.btn-white:hover {
    transform: translateY(-3px);
}

/* =========================
   CONTACT
========================= */

.contact {
    background: white;
}

.contact-grid {
    margin-top: 45px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.contact-card {
    border: 1px solid #d8e7f5;
    border-radius: 25px;
    padding: 30px;
}

.contact-card h3 {
    font-size: 20px;
    margin-bottom: 25px;
}

.contact-item {
    padding: 16px 0;
    border-bottom: 1px solid #dce8f3;
}

.contact-item:last-child {
    border-bottom: none;
}

.contact-item strong {
    display: block;
    margin-bottom: 4px;
}

.contact-item span {
    color: #587391;
}

.contact-list {
    padding-left: 25px;
}

.contact-list li {
    padding: 7px 0;
    color: #17324d;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #07182b;
    color: white;
    padding: 45px 0;
}

.footer-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.footer-logo {
    font-size: 24px;
    font-weight: 800;
}

.footer-text {
    color: #9bb2c8;
    font-size: 13px;
}
/* =========================
   FINAL MOBILE RESPONSIVE DESIGN
========================= */

@media (max-width: 768px) {

    /* ---------- NAVIGATION ---------- */

    nav {
        height: 68px;
    }

    .nav-inner {
        width: 92%;
        padding: 0;
    }

    .logo {
        font-size: 21px;
    }

    .nav-links {
        display: none;
    }

    .nav-inner > .btn {
        padding: 10px 16px;
        font-size: 12px;
        white-space: nowrap;
    }


    /* ---------- GENERAL ---------- */

    .container {
        width: 92%;
        max-width: 100%;
    }

    section {
        padding: 70px 0;
    }


    /* ---------- HERO ---------- */

    .hero {
        min-height: auto;
        padding: 65px 0 55px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        gap: 45px;
        text-align: center;
    }

    .label {
        font-size: 10px;
        padding: 7px 11px;
        margin-bottom: 20px;
    }

    .hero h1 {
        font-size: 45px;
        line-height: 1.02;
        letter-spacing: -2px;
        margin-bottom: 20px;
    }

    .hero p {
        max-width: 100%;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .hero-buttons {
        flex-direction: column;
        gap: 12px;
        width: 100%;
    }

    .hero-buttons .btn {
        width: 100%;
        min-height: 50px;
    }

    .hero-checks {
        flex-direction: column;
        gap: 9px;
        align-items: center;
        margin-top: 20px;
    }

    .hero-visual {
        min-height: auto !important;
        transform: none !important;
        gap: 18px !important;
        padding: 0 !important;
    }

    .hero-logo {
        width: 220px !important;
        max-width: 70% !important;
    }

    .hero-card {
        width: 100% !important;
        max-width: 330px !important;
        padding: 13px 16px !important;
        font-size: 13px !important;
        white-space: normal !important;
    }


    /* ---------- SECTION HEADINGS ---------- */

    .section-heading {
        width: 100%;
    }

    .section-heading h2 {
        font-size: 37px;
        line-height: 1.08;
        letter-spacing: -1.5px;
    }

    .section-heading p {
        font-size: 15px;
        line-height: 1.6;
    }


    /* ---------- HOW IT WORKS ---------- */

    .steps {
        grid-template-columns: 1fr;
        gap: 40px;
        margin-top: 50px;
    }

    .step {
        width: 100%;
    }

    .step-number {
        margin-bottom: 18px;
    }

    .step h3 {
        font-size: 18px;
    }

    .step p {
        font-size: 14px;
        line-height: 1.6;
    }


    /* ---------- BRAND + EVENT SECTIONS ---------- */

    .split {
        grid-template-columns: 1fr;
        min-height: auto;
        gap: 40px;
    }

    .split-image {
        min-height: 280px;
        width: 100%;
        border-radius: 22px;
    }

    .split-content h2 {
        font-size: 39px;
        line-height: 1.05;
        letter-spacing: -1.5px;
    }

    .split-content p {
        font-size: 15px;
        line-height: 1.7;
    }

    .bullet-list li,
    .check-list li {
        font-size: 14px;
        line-height: 1.6;
    }

    .split-content .btn {
        width: 100%;
    }


    /* ---------- IMPACT CARDS ---------- */

    .cards {
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 40px;
    }

    .card {
        min-height: auto;
        padding: 25px;
    }

    .card h3 {
        font-size: 19px;
    }

    .card p {
        font-size: 14px;
        line-height: 1.6;
    }


    /* ---------- CAMPAIGN IMAGES ---------- */

    .campaign-boxes {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 35px;
    }

    .campaign-box {
        height: 330px;
        width: 100%;
        border-radius: 20px;
        overflow: hidden;
    }

    .campaign-box img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 20px;
    }


    /* ---------- CTA ---------- */

    .cta {
        padding: 60px 0;
    }

    .cta-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
    }

    .cta h2 {
        font-size: 39px;
        line-height: 1.05;
    }

    .cta p {
        font-size: 15px;
        line-height: 1.6;
    }

    .btn-white {
        width: 100%;
    }


    /* ---------- CONTACT ---------- */

    .contact-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .contact-card {
        padding: 25px;
        border-radius: 20px;
    }

    .contact-card h3 {
        font-size: 19px;
    }

    .contact-item {
        font-size: 14px;
    }

    .contact-card .btn {
        width: 100%;
    }


    /* ---------- FOOTER ---------- */

    .footer-inner {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 15px;
    }

    .footer-logo {
        font-size: 21px;
    }

    .footer-text {
        font-size: 12px;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 400px) {

    .container {
        width: 90%;
    }

    .hero h1 {
        font-size: 39px;
    }

    .hero-logo {
        width: 190px !important;
    }

    .hero-card {
        font-size: 12px !important;
    }

    .section-heading h2 {
        font-size: 32px;
    }

    .split-content h2 {
        font-size: 34px;
    }

    .cta h2 {
        font-size: 34px;
    }

       .campaign-box {
        height: 280px;
    }
}

</style>
</head>

<body>
